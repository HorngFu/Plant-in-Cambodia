name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm build
      # Builds the Cloudflare worker and fails if it grows past the free 3 MiB (gzip) limit.
      - name: Cloudflare build and size check
        run: |
          pnpm cf-build
          pnpm exec wrangler deploy --dry-run --outdir .wrangler-dry | tee wrangler-dry.log
          node -e '
            const log = require("fs").readFileSync("wrangler-dry.log", "utf8");
            const m = log.match(/gzip: ([\d.]+) KiB/);
            if (!m) { console.error("Could not read worker size"); process.exit(1); }
            const kib = Number(m[1]);
            console.log(`Worker size (gzip): ${kib} KiB of 3072 KiB`);
            if (kib > 3072) process.exit(1);
          '
